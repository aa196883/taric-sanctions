# Application
spring.application.name=taric-sanctions

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/taric
spring.datasource.username=taric
spring.datasource.password=taric

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
# Batch ingestion of the materialized country relations
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

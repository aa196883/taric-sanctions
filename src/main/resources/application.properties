# Application
spring.application.name=taric-sanctions

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/taric
spring.datasource.username=taric
spring.datasource.password=taric

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# TARIC initial imports
taric.goods.import-file=resources/taric/full/Nomenclature EN.xlsx
taric.measures.import-file=resources/taric/full/Duties Import 01-99.xlsx
taric.measures.export-file=resources/taric/full/Duties Export 01-99.xlsx
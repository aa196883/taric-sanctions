services:

  postgres:
    image: postgres:17
    container_name: taric-postgres

    environment:
      POSTGRES_DB: taric
      POSTGRES_USER: taric
      POSTGRES_PASSWORD: taric

    ports:
      - "5433:5432"

    volumes:
      - taric-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taric -d taric"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taric-data: